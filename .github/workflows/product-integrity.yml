name: Product Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Build production application
        run: SF_HERMETIC_BUILD=1 npm run build

      - name: Check commercial offer integrity
        run: npm run check:offers

      - name: Check mirrored domain drift
        run: npm run check:drift

      - name: Check diagnostic authority
        run: npm run check:diagnostic-authority

      - name: Check native intake product truth
        run: npm run check:intake-truth

      - name: Check market surface integrity
        run: node scripts/check-market-surface-integrity.mjs

      - name: Check Stripe webhook transport safety
        run: npm run check:stripe-webhook

      - name: Check payment state machine truth
        run: npm run check:payment-state

      - name: Check scaffold provisioning truth
        run: npm run check:scaffold-provisioning

      - name: Check agent build manifests
        run: npm run check:agent-build

      - name: Check training unit integrity
        run: npm run check:training-unit

      - name: Check Learning OS authority
        run: npm run check:learning-os

      - name: Check Finance OS authority
        run: npm run check:finance-os

      - name: Check Backend OS module contract
        run: node scripts/check-backend-os-contract.mjs
