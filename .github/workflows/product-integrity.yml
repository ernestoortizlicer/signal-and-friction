name: Product Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check commercial offer integrity
        run: npm run check:offers

      - name: Check mirrored domain drift
        run: npm run check:drift

      - name: Check paid delivery contracts
        run: npm run test:contracts
