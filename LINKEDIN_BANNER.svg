<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#D4A853" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- BACKGROUND: #0A0908 solid obsidian -->
  <rect width="1584" height="396" fill="#0A0908"/>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <!-- LEFT ZONE (0–555px) — intentionally empty for profile photo -->
  <!-- Decorative corner brackets only — zero informational content -->
  <path d="M 40 40 L 40 68 L 68 68"   fill="none" stroke="#D4A853" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M 40 356 L 40 328 L 68 328" fill="none" stroke="#D4A853" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Soft vertical guide — not decorative, invisible at 4% -->
  <line x1="575" y1="48" x2="575" y2="348" stroke="#D4A853" stroke-opacity="0.04" stroke-width="1"/>

  <!-- RIGHT ZONE (575–1584px) — all critical content lives here -->

  <!-- Corner brackets: right -->
  <path d="M 1544 40 L 1544 68 L 1516 68"   fill="none" stroke="#D4A853" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M 1544 356 L 1544 328 L 1516 328" fill="none" stroke="#D4A853" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- ── CATEGORY LABEL ── -->
  <text
    x="600" y="102"
    fill="#D4A853" fill-opacity="0.78"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="11"
    letter-spacing="4.5"
  >COGNITIVE CONVERSION DIAGNOSTICS</text>

  <!-- Micro rule -->
  <line x1="600" y1="113" x2="850" y2="113" stroke="#D4A853" stroke-opacity="0.20" stroke-width="0.75"/>

  <!-- ── WORDMARK ── -->
  <text
    x="600" y="178"
    fill="#F5F0EB"
    font-family="Arial, Helvetica, sans-serif"
    font-size="57"
    font-weight="800"
    letter-spacing="-1"
  >SIGNAL <tspan fill="#D4A853">&amp;</tspan> FRICTION</text>

  <!-- Golden underline (200px, 40% of wordmark) -->
  <line x1="600" y1="193" x2="800" y2="193" stroke="#D4A853" stroke-opacity="1" stroke-width="1.5"/>

  <!-- ── TAGLINE ── -->
  <text
    x="600" y="228"
    fill="#9A8F82"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16.5"
    letter-spacing="0.1"
  >We isolate the single cognitive friction point killing your revenue</text>
  <text
    x="600" y="252"
    fill="#9A8F82"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16.5"
    letter-spacing="0.1"
  >— and fix it with a guarantee.</text>

  <!-- ── URL — bottom-right, right-anchored ── -->
  <text
    x="1544" y="350"
    text-anchor="end"
    fill="#D4A853" fill-opacity="0.55"
    font-family="'Courier New', monospace"
    font-size="13"
    letter-spacing="1.5"
  >signal-and-friction.com</text>

  <!-- ── GEOMETRIC SYMBOL — far right, centered at (1400, 198) ── -->
  <!-- Concentric diagnostic rings -->
  <circle cx="1400" cy="198" r="128" fill="none" stroke="#D4A853" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="1400" cy="198" r="95"  fill="none" stroke="#D4A853" stroke-opacity="0.11" stroke-width="1"/>
  <circle cx="1400" cy="198" r="64"  fill="none" stroke="#D4A853" stroke-opacity="0.17" stroke-width="1"/>
  <circle cx="1400" cy="198" r="37"  fill="none" stroke="#D4A853" stroke-opacity="0.27" stroke-width="1"/>
  <circle cx="1400" cy="198" r="15"  fill="none" stroke="#D4A853" stroke-opacity="0.44" stroke-width="1.5"/>

  <!-- Crosshair -->
  <line x1="1400" y1="58"  x2="1400" y2="338" stroke="#D4A853" stroke-opacity="0.09" stroke-width="1"/>
  <line x1="1260" y1="198" x2="1540" y2="198" stroke="#D4A853" stroke-opacity="0.09" stroke-width="1"/>

  <!-- Tick marks at ring intersections -->
  <line x1="1400" y1="99"  x2="1400" y2="110" stroke="#D4A853" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="1400" y1="286" x2="1400" y2="297" stroke="#D4A853" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="1302" y1="198" x2="1313" y2="198" stroke="#D4A853" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="1487" y1="198" x2="1498" y2="198" stroke="#D4A853" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- Center point -->
  <circle cx="1400" cy="198" r="5"  fill="#D4A853" fill-opacity="1"/>
  <circle cx="1400" cy="198" r="9"  fill="none" stroke="#D4A853" stroke-opacity="0.55" stroke-width="1"/>

  <!-- ── SIGNAL WAVEFORM — friction → signal (left of target, inside right zone) ── -->
  <!-- Ghost wave — noisy past -->
  <path
    d="M 1185 198 C 1202 222 1220 174 1238 198 C 1256 222 1274 174 1292 198 L 1312 198"
    fill="none" stroke="#D4A853" stroke-opacity="0.10" stroke-width="1.5"
  />

  <!-- Friction scatter dots -->
  <circle cx="1188" cy="182" r="1.5" fill="#D4A853" fill-opacity="0.22"/>
  <circle cx="1196" cy="213" r="1.5" fill="#D4A853" fill-opacity="0.22"/>
  <circle cx="1205" cy="190" r="2"   fill="#D4A853" fill-opacity="0.26"/>
  <circle cx="1213" cy="172" r="1.5" fill="#D4A853" fill-opacity="0.20"/>
  <circle cx="1222" cy="219" r="1.5" fill="#D4A853" fill-opacity="0.20"/>
  <circle cx="1231" cy="195" r="2"   fill="#D4A853" fill-opacity="0.28"/>
  <circle cx="1240" cy="177" r="1.5" fill="#D4A853" fill-opacity="0.22"/>
  <circle cx="1249" cy="215" r="1.5" fill="#D4A853" fill-opacity="0.22"/>
  <circle cx="1258" cy="191" r="2"   fill="#D4A853" fill-opacity="0.30"/>
  <circle cx="1267" cy="207" r="2"   fill="#D4A853" fill-opacity="0.30"/>

  <!-- Convergence zone -->
  <circle cx="1277" cy="198" r="2.5" fill="#D4A853" fill-opacity="0.38"/>
  <circle cx="1288" cy="199" r="3"   fill="#D4A853" fill-opacity="0.46"/>
  <circle cx="1300" cy="198" r="3.5" fill="#D4A853" fill-opacity="0.55"/>
  <circle cx="1313" cy="198" r="4"   fill="#D4A853" fill-opacity="0.65"/>

  <!-- Clean signal line — the isolated truth -->
  <line x1="1325" y1="198" x2="1360" y2="198" stroke="#D4A853" stroke-opacity="0.80" stroke-width="2"/>

  <!-- Instrument readout ticks — right edge -->
  <line x1="1477" y1="150" x2="1507" y2="150" stroke="#D4A853" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="1487" y1="170" x2="1507" y2="170" stroke="#D4A853" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1483" y1="198" x2="1507" y2="198" stroke="#D4A853" stroke-opacity="0.22" stroke-width="1"/>
  <line x1="1487" y1="226" x2="1507" y2="226" stroke="#D4A853" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1477" y1="246" x2="1507" y2="246" stroke="#D4A853" stroke-opacity="0.16" stroke-width="1"/>
</svg>
