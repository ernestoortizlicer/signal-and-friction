<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1500px;
      height: 500px;
      overflow: hidden;
      background: #0A0908;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .banner {
      width: 1500px;
      height: 500px;
      background: #0A0908;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* Warm gradient depth */
    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0A0908 0%, #0F0D0A 40%, #0A0908 100%);
      pointer-events: none;
    }

    /* Subtle ambient glow */
    .glow {
      position: absolute;
      top: 50%;
      right: 18%;
      transform: translate(50%, -50%);
      width: 450px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(184, 92, 56, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Film grain overlay */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: right;
      padding-right: 90px;
      /* 
        Tally uses background-size:cover + background-position:center.
        On desktop, visible vertical range is roughly y=130 to y=370 (out of 500).
        Text MUST be within this safe zone.
        Content block height ≈ 120px, centered at y=250 → safe.
      */
    }

    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 56px;
      color: #F5F0EB;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-rendering: optimizeLegibility;
    }

    .title .amp {
      color: #B85C38;
      font-style: italic;
    }

    .divider {
      width: 160px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(184, 92, 56, 0.12), transparent);
      margin: 16px 0 16px auto;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #B85C38;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 300;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="glow"></div>
    <div class="grain"></div>
    <div class="content">
      <div class="title">Signal <span class="amp">&amp;</span> Friction</div>
      <div class="divider"></div>
      <div class="subtitle">Revenue Friction Diagnostic</div>
    </div>
  </div>
</body>
</html>
